<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Erreur serveur — E-Do Studio</title>
<meta name="description" content="Une erreur interne est survenue. Server error."/>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; padding: 0; height: 100%; background: #ffffff; color: #141414; }
  body {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px; text-align: center;
  }
  .code { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #767676; }
  h1 { font-family: ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; font-weight: 300; font-size: clamp(28px, 5vw, 44px); line-height: 1.1; letter-spacing: -0.01em; margin: 16px 0 8px; }
  p { font-size: 13px; color: #767676; max-width: 28rem; margin: 4px 0; }
  .lang-sep { display: block; height: 1px; width: 32px; background: #e5e5e5; margin: 18px auto; }
  a.cta { display: inline-flex; align-items: center; height: 40px; padding: 0 20px; margin-top: 24px;
    background: #141414; color: #fff; text-decoration: none; font-size: 12px; letter-spacing: 0.08em;
    text-transform: uppercase; transition: opacity .15s ease; }
  a.cta:hover { opacity: .9; }
</style>
</head>
<body>
  <main role="main">
    <div class="code">500</div>
    <h1>Erreur serveur</h1>
    <p>Une erreur interne est survenue. Merci de réessayer dans un instant.</p>
    <span class="lang-sep" aria-hidden="true"></span>
    <h1>Server error</h1>
    <p>An internal error has occurred. Please try again shortly.</p>
    <a class="cta" href="/fr">Retour / Home</a>
  </main>
</body>
</html>
