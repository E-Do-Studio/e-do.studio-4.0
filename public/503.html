<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Maintenance — E-Do Studio</title>
<meta name="description" content="Le site est temporairement indisponible pour maintenance. Site temporarily unavailable."/>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; padding: 0; height: 100%; background: #ffffff; color: #141414; }
  body {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px; text-align: center;
  }
  .code { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #767676; }
  h1 { font-family: ui-sans-serif, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; font-weight: 300; font-size: clamp(28px, 5vw, 44px); line-height: 1.1; letter-spacing: -0.01em; margin: 16px 0 8px; }
  p { font-size: 13px; color: #767676; max-width: 28rem; margin: 4px 0; }
  .lang-sep { display: block; height: 1px; width: 32px; background: #e5e5e5; margin: 18px auto; }
</style>
</head>
<body>
  <main role="main">
    <div class="code">503</div>
    <h1>Site en maintenance</h1>
    <p>Le site est temporairement indisponible. Nous revenons très vite.</p>
    <span class="lang-sep" aria-hidden="true"></span>
    <h1>Under maintenance</h1>
    <p>The site is temporarily unavailable. We'll be back shortly.</p>
  </main>
</body>
</html>
