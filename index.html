<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<title>E-Do Studio — Studio photo & vidéo professionnel à Paris</title>
<meta name="description" content="Studio photo et vidéo professionnel à Paris. Cyclorama, plateaux de prise de vue, post-production. Location et services pour marques de mode, cosmétique, joaillerie et food."/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="index, follow"/>
<meta name="theme-color" content="#ffffff"/>
<meta name="color-scheme" content="light"/>
<!--
  Canonical is intentionally NOT shipped in the static HTML: every URL would
  otherwise canonicalize to /fr for non-JS crawlers (AI bots, social scrapers).
  src/lib/use-document-meta.ts injects a per-route canonical at runtime.
-->
<link rel="alternate" hreflang="fr" href="https://e-do.studio/fr"/>
<link rel="alternate" hreflang="en" href="https://e-do.studio/en"/>
<link rel="alternate" hreflang="x-default" href="https://e-do.studio/fr"/>

<!-- Resource hints: warm up connections before the bundle requests them -->
<link rel="preconnect" href="https://cms.e-do.studio" crossorigin/>
<link rel="dns-prefetch" href="https://cms.e-do.studio"/>

<!-- Open Graph -->
<meta property="og:type" content="website"/>
<meta property="og:site_name" content="E-Do Studio"/>
<meta property="og:title" content="E-Do Studio — Studio photo & vidéo professionnel à Paris"/>
<meta property="og:description" content="Studio photo et vidéo professionnel à Paris. Cyclorama, plateaux de prise de vue, post-production. Location et services pour marques de mode, cosmétique, joaillerie et food."/>
<meta property="og:url" content="https://e-do.studio"/>
<meta property="og:locale" content="fr_FR"/>
<meta property="og:locale:alternate" content="en_US"/>
<meta property="og:image" content="https://e-do.studio/og-image.png"/>
<meta property="og:image:width" content="1200"/>
<meta property="og:image:height" content="630"/>
<meta property="og:image:alt" content="E-Do Studio — Studio photo & vidéo professionnel à Paris"/>

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:title" content="E-Do Studio — Studio photo & vidéo professionnel à Paris"/>
<meta name="twitter:description" content="Studio photo et vidéo professionnel à Paris. Cyclorama, plateaux de prise de vue, post-production."/>
<meta name="twitter:image" content="https://e-do.studio/twitter-card.png"/>

<!-- Critical self-hosted fonts: preload the Light (300) cut used by the hero
     titles + the Mono Book (400) used for eyebrow labels. The remaining ABC
     Favorit weights are pulled by the CSS @font-face declarations on demand. -->
<link rel="preload" as="font" type="font/woff2" href="/fonts/ABCFavorit-Light.woff2" crossorigin/>
<link rel="preload" as="font" type="font/woff2" href="/fonts/ABCFavoritMono-Book.woff2" crossorigin/>

<!-- LCP preload: gallery hero (largest above-the-fold image on home) -->
<link rel="preload" as="image" href="/gallery-hero.avif" type="image/avif" fetchpriority="high"/>

<!-- Favicons -->
<link rel="shortcut icon" href="/favicon.ico"/>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png"/>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>
<link rel="manifest" href="/site.webmanifest"/>

<!--
  Structured Data: a minimal Organization + WebSite baseline is shipped in the
  initial HTML so crawlers that skip JS still see who we are. Page-specific
  JSON-LD (LocalBusiness with full address/hours, Service, BlogPosting, etc.)
  is injected at runtime by src/lib/use-structured-data.ts.
-->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": "https://e-do.studio/#organization",
      "name": "E-Do Studio",
      "url": "https://e-do.studio",
      "logo": "https://e-do.studio/brand/logo-full.webp",
      "description": "Studio photo et vidéo professionnel à Paris. Location de plateaux, cyclorama et services de post-production.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Paris",
        "addressCountry": "FR"
      },
      "knowsAbout": ["photographie", "vidéo", "post-production", "cyclorama", "studio photo"]
    },
    {
      "@type": "WebSite",
      "@id": "https://e-do.studio/#website",
      "url": "https://e-do.studio",
      "name": "E-Do Studio",
      "inLanguage": "fr-FR",
      "publisher": { "@id": "https://e-do.studio/#organization" }
    }
  ]
}
</script>

<style>
  html,body,#root{margin:0;padding:0;height:100%;background:#fff;font-family:var(--font-sans);color:#141414;overflow:hidden}
</style>
</head>
<body>
<div id="root"></div>

<script type="module" src="/src/main.tsx"></script>
</body>
</html>
